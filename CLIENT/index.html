<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WONJUGA PORTAL</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#f4f4f4}
.login{max-width:420px;margin:80px auto;background:white;padding:24px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#129336;color:white;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#0f7a2b}
.hidden{display:none}
.header{background:#129336;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:20px;max-width:1100px;margin:auto}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div id="loginPage" class="login">
<h2 style="text-align:center">Kumasi Welfare</h2>
<input id="serviceNumber" placeholder="Service Number">
<input id="phone" placeholder="Phone">
<button onclick="login()">LOGIN</button>
<p id="msg" style="color:red;text-align:center"></p>
</div>
<div id="appPage" class="hidden">
<div class="header"><b id="userInfo"></b><button onclick="logout()" style="width:auto;padding:6px 12px;background:#0f5a1f">Logout</button></div>
<div style="padding:20px"><div id="myProfile"></div><div id="memberTable"></div></div>
</div>
<script>
const API = 'https://wonjuga-server.onrender.com/api';
let token=null; let user=null;
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+token};}
async function login(){
 const sn=document.getElementById('serviceNumber').value.trim();
 const ph=document.getElementById('phone').value.trim();
 const msgEl=document.getElementById('msg');
 msgEl.innerText='Checking...';
 try{
  const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idNumber:sn,phone:ph})});
  const d=await r.json();
  if(!r.ok){msgEl.innerText=d.error||d.message||JSON.stringify(d); return;}
  token=d.token; user=d.user;
  localStorage.setItem('token',token); localStorage.setItem('user',JSON.stringify(user));
  showApp();
 }catch(e){msgEl.innerText='Network error: '+e.message;}
}
function showApp(){
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('appPage').classList.remove('hidden');
 const u=user||JSON.parse(localStorage.getItem('user')||'{}');
 if(u&&u.idNumber){document.getElementById('userInfo').innerText=u.idNumber+' ('+u.role+')';}
}
function logout(){localStorage.clear(); location.reload();}
(function(){const t=localStorage.getItem('token'); const u=localStorage.getItem('user'); if(t&&u){token=t; user=JSON.parse(u); showApp();}})();
</script>
</body>
</html>
